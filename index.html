<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manulife Asia AI Champions Kickoff — Interactive Playbook</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --green:#00A758;--green-deep:#00874A;--green-soft:#E7F5EE;
    --ink:#1A1A1A;--paper:#FFFFFF;--cream:#F5F6F4;
    --blue:#0067B8;--blue-soft:#E8F1FB;--amber:#B25E00;--amber-soft:#FBF0E2;
    --muted:#6A6A6A;--line:rgba(26,26,26,.14);--shadow:0 20px 55px rgba(20,40,30,.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;color:var(--ink);overflow-x:hidden;
    background:linear-gradient(160deg,transparent 0 70%,rgba(0,167,88,.05) 70% 100%),var(--cream);
    font-family:"Segoe UI","Aptos",system-ui,sans-serif;line-height:1.5;}
  button,a,select{font:inherit;} a{color:inherit;} button{color:inherit;cursor:pointer;}
  .skip-link{position:fixed;top:.75rem;left:-999px;z-index:200;padding:.7rem 1rem;color:#fff;background:var(--ink);}
  .skip-link:focus{left:.75rem;}

  .topbar{position:sticky;top:0;z-index:100;display:grid;
    grid-template-columns:minmax(220px,1fr) minmax(240px,540px) auto;align-items:center;gap:1.4rem;
    min-height:74px;padding:.7rem clamp(1rem,3vw,2.1rem);
    background:rgba(255,255,255,.97);border-bottom:4px solid var(--green);backdrop-filter:blur(10px);}
  .brand{display:flex;align-items:center;gap:.85rem;min-width:0;}
  .brand img.mlogo{height:26px;} .brand img.mslogo{height:22px;}
  .brand .x{color:var(--muted);font-weight:700;}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
  .progress-label{display:flex;justify-content:space-between;margin-bottom:.4rem;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
  .progress-track{height:.42rem;background:rgba(0,167,88,.15);overflow:hidden;border-radius:3px;}
  .progress-fill{display:block;width:14%;height:100%;background:linear-gradient(90deg,var(--green),#43c98a);transition:width .24s ease;}
  .badge{padding:.42rem .6rem;color:#fff;background:var(--green);font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}

  .layout{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;gap:1.2rem;width:min(1660px,100%);margin:0 auto;padding:1.2rem;}
  .rail,.resources{position:sticky;top:98px;align-self:start;max-height:calc(100vh - 116px);overflow:auto;}
  .rail{padding:1rem;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;}
  .mode-toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin-bottom:.9rem;padding:.3rem;background:var(--green-soft);border-radius:9px;}
  .mode-btn{padding:.5rem .25rem;text-align:center;border:0;background:transparent;border-radius:7px;font-weight:800;font-size:.71rem;line-height:1.15;color:var(--green-deep);}
  .mode-btn.is-active{background:var(--ink);color:#fff;}
  .rail-header{padding:.2rem .4rem .9rem;border-bottom:1px solid var(--line);}
  .eyebrow{margin:0 0 .5rem;color:var(--green-deep);font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
  h1,h2,h3,h4{margin:0;letter-spacing:-.02em;}
  h1{font-size:1.42rem;line-height:1.08;} h2{font-size:clamp(1.9rem,3.6vw,3.1rem);line-height:1.04;} h3{font-size:1.28rem;} h4{font-size:1.02rem;}
  .nav{display:grid;gap:.3rem;padding-top:.8rem;}
  .nav-button{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.65rem;align-items:center;width:100%;padding:.6rem;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;}
  .nav-button:hover,.nav-button:focus-visible{background:var(--green-soft);}
  .nav-button.is-active{color:#fff;background:var(--ink);}
  .nav-number{display:grid;place-items:center;width:2rem;height:2rem;color:#fff;background:var(--green);font-size:.72rem;font-weight:900;border-radius:6px;}
  .nav-button strong{font-size:.92rem;} .nav-button small{display:block;margin-top:.08rem;color:var(--muted);font-size:.74rem;}
  .nav-button.is-active small{color:rgba(255,255,255,.7);}

  .stage{min-width:0;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;}
  .panel{display:none;min-height:calc(100vh - 168px);padding:clamp(1.5rem,4vw,3.4rem);}
  .panel.is-active{display:block;animation:reveal .28s ease-out both;}
  @keyframes reveal{from{transform:translateY(10px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .kicker{display:flex;align-items:center;gap:.7rem;width:fit-content;margin-bottom:1rem;color:var(--green-deep);font-size:.74rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;}
  .kicker::before{content:"";width:2.4rem;height:4px;background:var(--green);}
  .kicker.agent{color:var(--blue);} .kicker.agent::before{background:var(--blue);}
  .lede{max-width:840px;margin:1.1rem 0 1.7rem;color:var(--muted);font-size:clamp(1.02rem,1.6vw,1.26rem);}

  .grid3,.grid2,.grid4{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .grid3{grid-template-columns:repeat(3,1fr);} .grid2{grid-template-columns:repeat(2,1fr);} .grid4{grid-template-columns:repeat(4,1fr);}
  .grid3 article,.grid2 article,.grid4 article{padding:1.1rem;background:var(--paper);}
  .grid3 strong,.grid2 strong{display:block;margin-bottom:.25rem;color:var(--green-deep);font-size:1.02rem;}
  .grid3 p,.grid2 p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem;}

  .formula{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:1.3rem 0;border-radius:8px;overflow:hidden;}
  .formula span{padding:1rem;text-align:center;font-weight:800;color:#fff;font-size:.92rem;}
  .ing-role{background:#6E56CF;} .ing-act{background:#0f7a87;} .ing-ctx{background:#8f2d56;} .ing-exp{background:#c25a00;} .ing-eq{background:#2f6f44;}
  @media(max-width:980px){.formula{grid-template-columns:repeat(2,1fr);}}

  .scenario{position:relative;margin:1.7rem 0;padding:1.35rem 1.5rem;color:#fff;background:var(--green-deep);overflow:hidden;border-radius:10px;}
  .scenario.agent{background:#123e57;}
  .scenario strong{font-size:1.12rem;} .scenario p{max-width:760px;margin:.5rem 0 0;}

  .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;}
  .pill{padding:.36rem .6rem;background:var(--green-soft);font-size:.76rem;font-weight:800;border-radius:5px;color:var(--green-deep);}
  .pill.blue{background:var(--blue-soft);color:var(--blue);} .pill.solid{background:var(--green);color:#fff;}

  .prompt-card{margin:1.1rem 0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:8px 8px 0 rgba(0,167,88,.1);overflow:hidden;}
  .prompt-card.blue{box-shadow:8px 8px 0 rgba(0,103,184,.1);}
  .prompt-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.72rem 1rem;border-bottom:1px solid var(--line);background:var(--green-soft);}
  .prompt-card.blue .prompt-header{background:var(--blue-soft);}
  .prompt-header h4{letter-spacing:0;color:var(--ink);}
  pre{margin:0;padding:1.05rem;white-space:pre-wrap;color:#2c2c2c;font:600 .95rem/1.6 "Segoe UI","Aptos",sans-serif;}
  .copy-button{padding:.42rem .7rem;color:#fff;background:var(--ink);border:0;font-weight:800;border-radius:6px;}
  .copy-button:hover,.copy-button:focus-visible{background:var(--green);} .copy-button.copied{background:var(--green);}

  .try-tag,.demo-tag{padding:.32rem .58rem;font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;}
  .try-tag{color:#fff;background:var(--green);} .demo-tag{color:#fff;background:var(--blue);}
  .prompt-card.blue .try-tag{background:var(--blue);}

  .race{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;padding:.5rem 1rem;background:#FAFBFA;border-bottom:1px solid var(--line);}
  .race::before{content:"RACE + EQ";margin-right:.15rem;color:var(--muted);font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}
  .race span{padding:.2rem .46rem;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;}
  .race .r{background:#6E56CF;} .race .a{background:#0f7a87;} .race .c{background:#8f2d56;} .race .e{background:#c25a00;} .race .eq{background:#2f6f44;}
  .why{margin:.55rem 0 0;padding:.6rem .8rem;background:var(--cream);border-left:3px solid var(--line);border-radius:0 6px 6px 0;color:var(--muted);font-size:.82rem;}
  .why b{color:var(--ink);}

  /* inline color-coding inside prompts, matched to the four ingredients */
  pre .r,pre .a,pre .c,pre .e,pre .eq{padding:.06em .18em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  pre .r{background:rgba(110,86,207,.14);box-shadow:inset 0 -2px 0 #6E56CF;}
  pre .a{background:rgba(15,122,135,.14);box-shadow:inset 0 -2px 0 #0f7a87;}
  pre .c{background:rgba(143,45,86,.14);box-shadow:inset 0 -2px 0 #8f2d56;}
  pre .e{background:rgba(194,90,0,.14);box-shadow:inset 0 -2px 0 #c25a00;}
  pre .eq{background:rgba(47,111,68,.14);box-shadow:inset 0 -2px 0 #2f6f44;}
  .race.live::after{content:"shown in the prompt below";margin-left:.2rem;color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.02em;text-transform:none;}
  .race.partial::before{content:"Ingredients used";}
  .race.partial::after{content:"\2014\00a0that is all it needs";}

  /* which app each step runs in, and how the output travels to the next step */
  .app-chip{display:inline-flex;align-items:center;padding:.26rem .5rem;color:#fff;background:var(--ink);border-radius:5px;font-size:.64rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;vertical-align:middle;}
  .app-chip.chat{background:#6E56CF;} .app-chip.word{background:#185ABD;} .app-chip.ppt{background:#C43E1C;} .app-chip.cowork{background:var(--blue);}
  .extra-band{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin:2.1rem 0 .2rem;padding:.8rem 1.05rem;background:var(--blue-soft);border-left:6px solid var(--blue);border-radius:0 9px 9px 0;}
  .extra-band span{padding:.28rem .6rem;background:var(--blue);color:#fff;border-radius:5px;font-size:.64rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
  .extra-band b{font-size:.95rem;color:var(--ink);}
  .chainmap{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.5rem;margin:1.2rem 0 1.5rem;}
  .chainmap > div{padding:.7rem .8rem;background:#fff;border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:0 0 9px 9px;}
  .chainmap > div b{display:block;margin:.42rem 0 .12rem;font-size:.92rem;}
  .chainmap > div small{display:block;color:var(--muted);font-size:.75rem;line-height:1.35;}
  .chainmap > i{display:grid;place-items:center;align-content:center;padding:0 .25rem;color:var(--amber);font-style:normal;font-size:.64rem;font-weight:900;text-align:center;line-height:1.3;}
  .chainmap > i::before{content:"\2192";display:block;font-size:1.35rem;line-height:1;}
  @media(max-width:900px){.chainmap{grid-template-columns:1fr;}.chainmap > i::before{content:"\2193";}}
  .handoff{display:flex;gap:.8rem;align-items:flex-start;margin:.85rem 0 .85rem 1.5rem;padding:.8rem 1rem;background:#fff;border:1px dashed rgba(26,26,26,.32);border-radius:9px;}
  .handoff .ic{flex:0 0 auto;display:grid;place-items:center;width:1.85rem;height:1.85rem;background:var(--ink);color:#fff;border-radius:50%;font-size:1rem;font-weight:900;}
  .handoff > div > b{display:block;font-size:.88rem;color:var(--ink);}
  .handoff p b{display:inline;color:var(--ink);font-weight:800;}
  .handoff p{margin:.28rem 0 0;color:var(--muted);font-size:.84rem;}
  .handoff .warn{color:var(--amber);font-weight:800;}
  .io-note{display:block;margin:0;padding:.62rem 1rem;background:var(--cream);border-top:1px solid var(--line);color:var(--muted);font-size:.83rem;}
  .io-note b{color:var(--ink);}
  .io-note .tag{display:inline-block;margin-right:.4rem;padding:.16rem .42rem;background:var(--ink);color:#fff;border-radius:4px;font-size:.6rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
  .handoff code,.io-note code,.note code,.vs code,.cy code{padding:.06rem .3rem;background:var(--cream);border:1px solid var(--line);border-radius:4px;font-family:Consolas,monospace;font-size:.8rem;color:var(--ink);}
  .note code{background:rgba(255,255,255,.75);}
  pre .slot{padding:.06em .3em;background:#FFF1D6;box-shadow:inset 0 -2px 0 var(--amber);border-radius:3px;color:#7a4400;font-weight:800;}
  pre .slot.empty{background:var(--cream);box-shadow:inset 0 -2px 0 var(--line);color:var(--muted);font-style:italic;font-weight:700;}

  /* carry-over box: turns your step 2 output into the step 3 prompt */
  .cy{margin:.2rem 0 1.1rem 1.5rem;padding:1rem 1.15rem;background:#fff;border:1px solid var(--line);border-top:5px solid var(--amber);border-radius:0 0 10px 10px;}
  .cy h4{margin:0 0 .2rem;font-size:1rem;color:var(--ink);}
  .cy .sub{margin:0 0 .85rem;color:var(--muted);font-size:.85rem;}
  .cy-tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.85rem;padding:.3rem;background:var(--cream);border-radius:9px;}
  .cy-tab{flex:1 1 auto;padding:.5rem .7rem;border:0;background:transparent;border-radius:7px;color:var(--muted);font-weight:800;font-size:.8rem;font-family:inherit;line-height:1.25;}
  .cy-tab:hover{color:var(--ink);}
  .cy-tab.is-on{background:var(--ink);color:#fff;}
  .cy-pane{display:none;} .cy-pane.on{display:block;}
  .cy label{display:block;margin-bottom:.25rem;color:var(--amber);font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
  .cy input,.cy textarea{width:100%;padding:.55rem .65rem;border:1px solid var(--line);border-radius:6px;background:var(--cream);font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.5;}
  .cy textarea{min-height:110px;resize:vertical;}
  .cy input:focus,.cy textarea:focus{outline:2px solid var(--amber);outline-offset:1px;background:#fff;}
  .cy-hint{margin:.5rem 0 0;color:var(--muted);font-size:.8rem;}
  .cy-hint b{color:var(--ink);}
  .cy-live{display:flex;align-items:center;gap:.4rem;margin:.7rem 0 0;padding:.5rem .7rem;background:var(--amber-soft);border-radius:7px;color:var(--amber);font-size:.79rem;font-weight:800;}
  .cy-live::before{content:"\2193";font-weight:900;}

  /* option A / B blocks */
  .opt-or{display:flex;align-items:center;gap:.9rem;margin:1.1rem 0;color:var(--muted);font-size:.72rem;font-weight:900;letter-spacing:.12em;}
  .opt-or::before,.opt-or::after{content:"";flex:1;height:1px;background:var(--line);}
  .opt-tag{padding:.3rem .6rem;color:#fff;background:var(--ink);border-radius:5px;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
  .opt-tag.b{background:var(--blue);}

  /* workflow pattern flows */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin:.45rem 0 0;}
  .flow span{padding:.34rem .6rem;background:var(--green-soft);color:var(--green-deep);border-radius:5px;font-size:.78rem;font-weight:800;}
  .flow i{color:var(--muted);font-style:normal;font-weight:900;}
  .flow.blue span{background:var(--blue-soft);color:var(--blue);}
  .pattern{padding:.85rem 1.05rem;background:#fff;border:1px solid var(--line);border-radius:9px;margin:.55rem 0;}
  .pattern b{display:block;font-size:.92rem;color:var(--ink);}
  .datafile{display:flex;gap:.85rem;align-items:flex-start;margin:1.1rem 0;padding:.95rem 1.1rem;background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:0 9px 9px 0;}
  .datafile .ic{flex:0 0 auto;width:2.1rem;height:2.1rem;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);border-radius:6px;font-size:1rem;}
  .datafile b{display:block;font-size:.94rem;color:var(--ink);}
  .datafile p{margin:.2rem 0 0;color:var(--muted);font-size:.85rem;}
  .datafile code{padding:.1rem .35rem;background:var(--cream);border-radius:4px;font-size:.82rem;font-family:Consolas,monospace;}

  .ws{margin:1.3rem 0;padding:1.15rem 1.25rem;background:#fff;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:0 0 10px 10px;}
  .ws h4{margin:0 0 .2rem;font-size:1.02rem;color:var(--ink);}
  .ws .sub{margin:0 0 .9rem;color:var(--muted);font-size:.85rem;}
  .ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .ws-grid .full{grid-column:1 / -1;}
  .ws label{display:block;margin-bottom:.25rem;color:var(--blue);font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
  .ws input,.ws select{width:100%;padding:.55rem .65rem;border:1px solid var(--line);border-radius:6px;background:var(--cream);font-size:.9rem;color:var(--ink);}
  .ws input:focus,.ws select:focus{outline:2px solid var(--blue);outline-offset:1px;background:#fff;}
  .ws .hintline{margin:.75rem 0 0;color:var(--muted);font-size:.8rem;}
  .ws .hintline b{color:var(--ink);}
  .ws-status{display:inline-block;margin-left:.4rem;padding:.15rem .45rem;background:var(--green-soft);color:var(--green-deep);border-radius:4px;font-size:.68rem;font-weight:800;opacity:0;transition:opacity .2s;}
  .ws-status.on{opacity:1;}
  .fill{padding:.06em .2em;background:rgba(0,103,184,.12);box-shadow:inset 0 -2px 0 var(--blue);border-radius:3px;}
  .fill.empty{background:var(--cream);box-shadow:inset 0 -2px 0 var(--line);color:var(--muted);font-style:italic;}
  @media(max-width:760px){.ws-grid{grid-template-columns:1fr;}}
  .dl{display:inline-flex;align-items:center;gap:.4rem;margin:.5rem .4rem 0 0;padding:.5rem .8rem;color:#fff;background:var(--blue);border-radius:6px;font-size:.82rem;font-weight:800;text-decoration:none;}
  .dl:hover,.dl:focus-visible{background:var(--ink);}
  .dl::before{content:"\2193";font-weight:900;}
  .resource-block a.dl{display:inline-flex;color:#fff;padding:.5rem .8rem;}
  .pattern em{display:block;margin-top:.15rem;color:var(--muted);font-size:.8rem;font-style:normal;}

  /* two-column compare */
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:1.2rem 0;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .vs>div{padding:1rem 1.15rem;background:#fff;}
  .vs h5{margin:0 0 .3rem;font-size:.95rem;letter-spacing:0;}
  .vs p{margin:.25rem 0 0;color:var(--muted);font-size:.85rem;}
  @media(max-width:760px){.vs{grid-template-columns:1fr;}}

  /* KPI -> process -> activity -> use case chain */
  .chain{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:1.1rem 0 .4rem;}
  .chain div{padding:.7rem .5rem;text-align:center;color:#fff;border-radius:7px;font-size:.82rem;font-weight:800;line-height:1.25;}
  .chain small{display:block;margin-top:.2rem;font-size:.68rem;font-weight:700;opacity:.85;}
  .c1{background:#0f7a87;} .c2{background:#2f6f44;} .c3{background:#8f2d56;} .c4{background:#c25a00;}
  @media(max-width:760px){.chain{grid-template-columns:1fr 1fr;}}

  .steps{display:grid;gap:.6rem;margin:1.2rem 0;padding:0;list-style:none;counter-reset:steps;}
  .steps li{position:relative;padding-left:2.95rem;min-height:2.2rem;}
  .steps li::before{counter-increment:steps;content:counter(steps);position:absolute;left:0;top:0;display:grid;place-items:center;width:2.2rem;height:2.2rem;color:#fff;background:var(--green);font-weight:900;border-radius:6px;}
  .steps.blue li::before{background:var(--blue);}
  .steps strong{display:block;} .steps small{color:var(--muted);display:block;}

  .note{margin:1.2rem 0;padding:1rem 1.15rem;border-left:6px solid var(--green);background:var(--green-soft);border-radius:0 8px 8px 0;}
  .note.blue{border-color:var(--blue);background:var(--blue-soft);} .note.amber{border-color:var(--amber);background:var(--amber-soft);}
  .note strong{display:block;margin-bottom:.2rem;}
  .note .lbl{display:block;margin-bottom:.35rem;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep);}
  .note.blue .lbl{color:var(--blue);} .note.amber .lbl{color:var(--amber);}

  .bu-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin:1.2rem 0;padding:1rem 1.15rem;background:var(--ink);border-radius:10px;color:#fff;}
  .bu-bar label{font-weight:800;font-size:.92rem;}
  .bu-bar select{padding:.55rem .7rem;border-radius:7px;border:0;background:#fff;color:var(--ink);font-weight:700;min-width:220px;}
  .bu-bar .hint{color:rgba(255,255,255,.6);font-size:.82rem;}
  .bu-kpis{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;}
  .kpi-chip{padding:.4rem .7rem;background:var(--green-soft);color:var(--green-deep);font-weight:800;font-size:.85rem;border-radius:20px;}
  .kpi-choices{display:flex;flex-wrap:wrap;gap:.45rem;}
  .kpi-opt{padding:.42rem .75rem;background:var(--green-soft);color:var(--green-deep);border:2px solid transparent;font-weight:800;font-size:.85rem;border-radius:20px;cursor:pointer;transition:.15s;font-family:inherit;}
  .kpi-opt:hover{border-color:var(--green-deep);}
  .kpi-opt.is-on{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .kpi-opt .x{margin-left:.4rem;opacity:.65;font-weight:900;}
  .chain-pick{margin:1.1rem 0;padding:.85rem 1rem;background:#fff;border:1px solid var(--line);border-top:5px solid var(--green-deep);border-radius:0 0 10px 10px;}
  .cp-step{margin-bottom:.65rem;}
  .cp-step:last-child{margin-bottom:0;}
  .cp-step > label{display:block;margin-bottom:.3rem;color:var(--green-deep);font-size:.65rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
  .cp-step > label .opt{margin-left:.35rem;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:.72rem;}
  .kpi-choices{display:flex;flex-wrap:wrap;gap:.3rem;}
  .kpi-opt{padding:.32rem .58rem;background:var(--green-soft);color:var(--green-deep);border:2px solid transparent;font-weight:800;font-size:.78rem;border-radius:20px;cursor:pointer;transition:.15s;font-family:inherit;line-height:1.25;}
  .kpi-opt:hover{border-color:var(--green-deep);}
  .kpi-opt.is-on{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .kpi-opt .x{margin-left:.35rem;opacity:.65;font-weight:900;}
  .kpi-opt.add{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:800;}
  .kpi-opt.add:hover{color:var(--green-deep);border-color:var(--green-deep);}
  .cp-inline{display:none;margin-top:.4rem;}
  .cp-inline.on{display:block;}
  .cp-inline input,.cp-act{width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--cream);font-size:.85rem;color:var(--ink);font-family:inherit;}
  .cp-inline input:focus,.cp-act:focus{outline:2px solid var(--green-deep);outline-offset:1px;background:#fff;}
  .step-tag{margin-left:.4rem;padding:.12rem .4rem;background:var(--green);color:#06281a;border-radius:4px;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;}
  .resource-block a.open-copilot::before{content:none;}
  .open-copilot{display:flex;align-items:center;gap:.6rem;width:100%;margin:.1rem 0 .5rem;padding:.7rem .8rem;background:#fff;border-radius:9px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.15s;}
  .open-copilot:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.26);}
  .open-copilot img{width:30px;height:27px;flex:0 0 auto;}
  .open-copilot span{min-width:0;}
  .open-copilot .oc-t{display:block;color:var(--ink);font-size:.86rem;font-weight:900;line-height:1.2;}
  .open-copilot .oc-s{display:block;margin-top:.1rem;color:var(--muted);font-size:.72rem;font-weight:700;}
  .uc-summary{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem;}
  .uc-summary span{padding:.28rem .55rem;background:var(--green-soft);color:var(--green-deep);border-radius:5px;font-size:.76rem;font-weight:800;}
  .uc-summary span.mut{background:var(--cream);color:var(--muted);font-style:italic;font-weight:700;}
  .ws textarea{width:100%;min-height:104px;padding:.55rem .65rem;border:1px solid var(--line);border-radius:6px;background:var(--cream);font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.5;resize:vertical;}
  .ws textarea:focus{outline:2px solid var(--blue);outline-offset:1px;background:#fff;}
  .ws input[readonly]{background:var(--green-soft);color:var(--green-deep);font-weight:800;}
  .uc-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem;}
  .uc-actions button{padding:.6rem 1.1rem;border:0;border-radius:7px;font-weight:800;font-size:.88rem;cursor:pointer;font-family:inherit;}
  .uc-primary{background:var(--blue);color:#fff;}
  .uc-secondary{background:var(--cream);color:var(--ink);border:1px solid var(--line) !important;}
  .uc-actions .msg{color:var(--green-deep);font-size:.82rem;font-weight:800;opacity:0;transition:opacity .2s;}
  .uc-actions .msg.on{opacity:1;}
  .bu-example{margin:1.1rem 0;padding:1.1rem 1.2rem;background:var(--cream);border:1px solid var(--line);border-radius:10px;}
  .bu-example .role{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep);}
  .bu-example h4{margin:.25rem 0 .4rem;}

  .guide{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1.3rem;border-top:1px solid var(--line);}
  .guide-button{padding:.7rem 1.05rem;color:#fff;background:var(--green);border:0;font-weight:800;border-radius:7px;}
  .guide-button.secondary{color:var(--ink);background:var(--green-soft);}
  .status{color:var(--muted);font-weight:800;font-size:.9rem;}

  .resources{padding:1.1rem;color:#fff;background:var(--ink);box-shadow:var(--shadow);border-radius:12px;}
  .resources h2{font-size:1.35rem;margin-bottom:.9rem;}
  .resource-block{padding:.85rem 0;border-top:1px solid rgba(255,255,255,.14);}
  .resource-block h3{margin-bottom:.5rem;color:#7fe0ad;font-size:.72rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;}
  .resource-block a{display:block;margin:.4rem 0;color:rgba(255,255,255,.82);font-size:.86rem;text-decoration:none;}
  .resource-block a:hover{color:#fff;} .resource-block a::before{content:"→ ";color:var(--green);}
  .ph{color:rgba(255,255,255,.5);font-size:.8rem;font-style:italic;}

  @media (max-width:1340px){.layout{grid-template-columns:262px minmax(0,1fr) 268px;gap:.85rem;padding:.85rem;}}
  @media (max-width:1040px){.layout{grid-template-columns:250px minmax(0,1fr);}.resources{position:static;grid-column:1/-1;max-height:none;}}
  @media (max-width:780px){
    .topbar{grid-template-columns:1fr auto;gap:.7rem;} .topbar-progress{grid-column:1/-1;grid-row:2;}
    .layout{display:block;padding:.75rem;} .rail{position:static;max-height:none;margin-bottom:.75rem;}
    .nav{grid-template-columns:repeat(2,1fr);} .nav-button small{display:none;}
    .grid3,.grid2,.grid4,.formula{grid-template-columns:1fr;} pre,h2,h3,p,a{overflow-wrap:anywhere;} .guide{flex-wrap:wrap;}
  }

/* ---------- Asia kickoff additions ---------- */
/* NA had three modes; this playbook has two, so the toggle must not keep a
   third, empty column reserved on the right */
.mode-toggle{grid-template-columns:1fr 1fr}

/* live-fill slots — a participant's own answer, dropped into the prompt */
pre .slot{padding:.06em .3em;background:#FFF1D6;box-shadow:inset 0 -2px 0 var(--amber);
  border-radius:3px;color:#7a4400;font-weight:800}
pre .slot.empty{background:var(--cream);box-shadow:inset 0 -2px 0 var(--line);
  color:var(--muted);font-style:italic;font-weight:700}

/* function picker + its worked example */
.bu-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .8rem;
  padding:.7rem .85rem;background:var(--green-soft);border-radius:10px}
.bu-bar label{font-weight:800;font-size:.82rem;color:var(--green-deep)}
.fn-select{font:inherit;font-size:.88rem;padding:.45rem .6rem;border:1.5px solid var(--line);
  border-radius:8px;background:#fff;max-width:280px}
.fn-select:focus{outline:none;border-color:var(--green)}
.bu-bar .hint{font-size:.76rem;color:var(--muted)}
.fn-example{margin:.2rem 0 1.2rem;padding:1rem 1.15rem;background:var(--cream);
  border:1px solid var(--line);border-left:4px solid var(--green);border-radius:0 10px 10px 0}
.fn-example .role{font-size:.7rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;
  color:var(--green-deep);margin-bottom:.5rem}
.fn-example h4{margin:.2rem 0 .3rem;font-size:1rem}
.fn-example .fn-use{margin:.45rem 0 0;font-size:.86rem;color:var(--ink)}
.kpi-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.2rem}
.kpi-chip{padding:.22rem .55rem;background:#fff;border:1px solid var(--line);
  border-radius:999px;font-size:.76rem;font-weight:650;color:var(--ink)}

/* identity + send */
.send-box{margin:1.4rem 0 .4rem;padding:1.15rem 1.2rem;background:var(--green-soft);
  border:1px solid var(--line);border-radius:12px}
.send-box h4{margin:0 0 .3rem;font-size:1rem}
.send-box p{margin:0 0 .9rem;font-size:.85rem;color:var(--ink)}
.send-actions{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-top:.9rem}
.send-msg{font-size:.82rem;color:var(--green-deep);font-weight:650}
#send-answers[disabled]{opacity:.6;cursor:default}
#reset-answers{width:100%;margin-top:.45rem}
.fac-note{margin:.9rem 0 .3rem;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.14);
  font-style:normal;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.66rem;
  color:var(--amber)}

/* progressive unlock — sections open in order, the way the SWA labs run */
.nav-button.is-locked{opacity:.42;cursor:not-allowed}
.nav-button.is-locked .nav-number{color:var(--muted)}
.nav-button.is-locked:hover{background:transparent}
.mode-btn.is-locked{opacity:.45;cursor:not-allowed}
/* six hex digits so CSS needs no terminating space, and the backslash is
   escaped so Python does not read "" as an octal control character */
.mode-btn.is-locked:after{content:" \01F512";font-size:.72em}
#export-wrap.is-locked #export-md-side{opacity:.45;cursor:not-allowed}
#export-wrap.is-locked #export-hint{color:rgba(255,255,255,.55)}
.send-box.is-locked{opacity:.5}
.send-box.is-locked button{cursor:not-allowed}
.lock-note{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,1.2rem);z-index:95;
  padding:.7rem 1.15rem;background:var(--ink);color:#fff;border-radius:10px;font-size:.86rem;
  font-weight:650;box-shadow:0 12px 34px rgba(0,0,0,.32);opacity:0;pointer-events:none;
  transition:opacity .18s ease, transform .18s ease}
.lock-note.show{opacity:1;transform:translate(-50%,0)}

/* pre-session survey playback on the opening pulse */
.pre-data{margin:1.2rem 0 1.4rem;padding:1.3rem 1.4rem 1.1rem;background:var(--cream);
  border:1px solid var(--line);border-radius:14px}
.pre-head{margin-bottom:1.2rem}
.pre-kicker{display:block;font-size:.7rem;font-weight:900;letter-spacing:.11em;
  text-transform:uppercase;color:var(--green-deep);margin-bottom:.35rem}
.pre-head p{margin:0;font-size:.88rem;color:var(--ink)}
.pre-chart{margin-bottom:1.3rem}
.pre-chart:last-of-type{margin-bottom:.2rem}
.pre-chart h4{margin:0 0 .7rem;font-size:.94rem;color:var(--ink)}
.pre-row{display:grid;grid-template-columns:minmax(0,1fr) 42% 1.6rem;align-items:center;
  gap:.7rem;margin-bottom:.34rem}
.pre-lbl{font-size:.82rem;color:var(--ink);line-height:1.3}
.pre-track{height:1.05rem;background:#E4E7EA;border-radius:4px;overflow:hidden}
.pre-fill{display:block;height:100%;background:var(--green);border-radius:4px}
.pre-fill.is-zero{background:transparent}
.pre-n{font-size:.82rem;font-weight:800;color:var(--ink);text-align:right}
.pre-note{margin:.55rem 0 0;font-size:.78rem;color:var(--muted);font-style:italic}
.pre-headline{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;margin:0 0 1.3rem;
  padding:.9rem 1.1rem;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--green);border-radius:10px}
.pre-headline b{font-size:1.6rem;font-weight:800;color:var(--green-deep);line-height:1;white-space:nowrap}
.pre-headline span{flex:1 1 240px;font-size:.86rem;line-height:1.5;color:var(--ink)}
@media (max-width:760px){ .pre-row{grid-template-columns:minmax(0,1fr) 30% 1.5rem} }

/* rehearsal marker — impossible to confuse a test run with the real day */
.session-badge{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:.35rem 1rem;
  background:var(--amber);color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.12em;
  text-align:center;text-transform:uppercase}
body.room-mode .session-badge{background:#B25E00}

/* share-with-the-room button under each pulse */
.pulse-send{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.9rem}
.pulse-msg{font-size:.82rem;color:var(--green-deep);font-weight:650}
[data-pulse-send][disabled]{opacity:.6;cursor:default}

/* ---------- facilitator room board (?room=1) ---------- */
/* the playbook markup is injected inside #app, so these cannot be child selectors */
body.room-mode .topbar,
body.room-mode .layout,
body.room-mode #gate{display:none !important}
body.room-mode #app{display:block !important}
body.room-mode{background:#08301F}
.room{max-width:1500px;margin:0 auto;padding:2.2rem 2.4rem 3rem;color:#fff}
.room-top{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap;
  padding-bottom:1.1rem;border-bottom:2px solid rgba(255,255,255,.16)}
.room-top h1{margin:0;font-size:2rem;letter-spacing:-.015em}
.room-top p{margin:.3rem 0 0;color:rgba(255,255,255,.62);font-size:.95rem}
.room-meta{text-align:right}
.room-meta span{display:block;font-size:1.9rem;font-weight:800;color:var(--green)}
.room-meta small{color:rgba(255,255,255,.5);font-size:.8rem}
.room-tabs{display:flex;gap:.5rem;margin:1.4rem 0 1.6rem;flex-wrap:wrap}
.room-tab{padding:.55rem 1.1rem;border:0;border-radius:999px;background:rgba(255,255,255,.09);
  color:rgba(255,255,255,.72);font-weight:700;font-size:.88rem;cursor:pointer}
.room-tab.is-on{background:var(--green);color:#fff}
.room-body{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.room-charts{display:contents}
.room-card{padding:1.5rem 1.6rem;background:rgba(255,255,255,.06);border-radius:16px}
.room-card h2{margin:0 0 1.2rem;font-size:1.12rem;color:var(--green);letter-spacing:.05em;text-transform:uppercase}
.room-needs{grid-column:1 / -1;max-height:46vh;overflow:auto}
.room-needs blockquote{margin:0 0 .7rem;padding:.8rem 1.1rem;background:rgba(255,255,255,.07);
  border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:1.15rem;line-height:1.45}
.room-empty{color:rgba(255,255,255,.45);font-style:italic;margin:0}
.bar-row{display:flex;align-items:center;gap:.9rem;margin-bottom:.7rem}
.bar-lbl{width:1.3rem;font-weight:800;font-size:1.15rem;color:rgba(255,255,255,.8)}
.bar-track{flex:1;height:1.9rem;background:rgba(255,255,255,.09);border-radius:6px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .5s ease}
.bar-n{width:2.2rem;text-align:right;font-weight:800;font-size:1.25rem}
.room-foot{margin:1.6rem 0 0;color:rgba(255,255,255,.68);font-size:1.05rem;font-weight:650}
@media (max-width:900px){ .room-body{grid-template-columns:1fr} }/* the base sheet ships .formula + .ing-role/.ing-eq; fill in the missing three
   using the same palette as the .race pills so the strip and the formula teach
   the same colour code */
.ing-action{background:#0f7a87}
.ing-context{background:#8f2d56}
.ing-expect{background:#c25a00}
.formula span small{display:block;font-weight:500;font-size:.72rem;opacity:.9;margin-top:.3rem;
  letter-spacing:0;text-transform:none}

.ws{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:1.15rem 1.2rem 1rem;margin:1.2rem 0}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem 1rem}
.ws-grid label{display:flex;flex-direction:column;gap:.35rem;font-size:.82rem;font-weight:650;color:var(--ink)}
.ws-grid label.wide{grid-column:1 / -1}
.ws-grid input,.ws-grid textarea,.ws-grid select{font:inherit;font-size:.86rem;font-weight:400;padding:.55rem .65rem;
  border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%;resize:vertical}
.ws-grid input:focus,.ws-grid textarea:focus,.ws-grid select:focus{outline:none;border-color:var(--green)}
.ws-status{margin:.7rem 0 0;font-size:.76rem;color:var(--muted);min-height:1em}

.qa-table{width:100%;border-collapse:collapse;margin:1.1rem 0;font-size:.85rem}
.qa-table th{background:var(--green);color:#fff;text-align:left;padding:.6rem .7rem;font-size:.72rem;
  letter-spacing:.05em;text-transform:uppercase}
.qa-table td{padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
.qa-table tr:nth-child(even) td{background:var(--cream)}

.pattern{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin:1.2rem 0}
.pattern>div{background:var(--cream);border:1px solid var(--line);border-top:3px solid var(--green);
  border-radius:12px;padding:1rem}
.pattern strong{display:block;font-size:.95rem;margin-bottom:.35rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1.2rem 0}
.vs>div{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:1rem}
.vs .flow{margin:.6rem 0 0;font-size:.78rem;color:var(--green-deep);font-weight:650}
.chainmap{display:flex;align-items:stretch;gap:.55rem;margin:1.2rem 0;flex-wrap:wrap}
.chainmap .cp-step{flex:1 1 190px;background:var(--cream);border:1px solid var(--line);
  border-top:3px solid var(--green);border-radius:12px;padding:.85rem}
.chainmap .cp-step small{display:block;color:var(--green-deep);font-weight:650;font-size:.74rem;margin:.1rem 0 .4rem}
.chainmap .cp-step p{margin:0;font-size:.79rem;color:var(--muted)}
.chainmap .handoff{align-self:center;font-size:.7rem;color:var(--muted);font-style:italic;max-width:96px;text-align:center}

/* worked chain examples — collapsed until champions have designed their own */
.chain-reveal{border:1px solid var(--line);border-radius:14px;background:#fff;margin:1.2rem 0;overflow:hidden}
.chain-reveal>summary{cursor:pointer;padding:.9rem 1.1rem;font-weight:750;font-size:.88rem;
  color:var(--green-deep);background:var(--cream);list-style:none;display:flex;
  align-items:center;justify-content:space-between;gap:1rem}
.chain-reveal>summary::-webkit-details-marker{display:none}
.chain-reveal>summary:after{content:"Show";font-size:.72rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:.2rem .6rem;background:#fff;white-space:nowrap}
.chain-reveal[open]>summary:after{content:"Hide"}
.chain-reveal>summary small{display:block;font-weight:500;font-size:.78rem;color:var(--muted);margin-top:.15rem}
.chain-body{padding:1.1rem}
/* sized off the container, not the viewport — the grid sits in a ~770px column
   between two rails, so a viewport media query would guess wrong */
.chain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:.9rem;margin-top:.9rem}
.chain-ex{background:var(--cream);border:1px solid var(--line);border-top:3px solid var(--green);
  border-radius:12px;padding:.9rem}
.chain-ex h4{margin:0 0 .55rem;font-size:.86rem;line-height:1.35;color:var(--ink)}
.chain-ex ol{margin:0;padding:0;list-style:none;counter-reset:ce}
.chain-ex li{counter-increment:ce;position:relative;padding:0 0 .7rem 1.5rem;font-size:.78rem;line-height:1.45}
.chain-ex li:last-child{padding-bottom:0}
.chain-ex li:before{content:counter(ce);position:absolute;left:0;top:.05rem;width:1.05rem;height:1.05rem;
  border-radius:50%;background:var(--green);color:#fff;font-size:.64rem;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.chain-ex li:not(:last-child):after{content:"";position:absolute;left:.5rem;top:1.25rem;bottom:.35rem;
  width:1px;background:var(--line)}
.ce-app{display:inline-block;font-weight:800;color:var(--green-deep);font-size:.74rem;
  letter-spacing:.02em;margin-right:.35rem}
.ce-do{color:var(--ink)}
.ce-out{display:block;margin-top:.2rem;color:var(--muted);font-style:italic;font-size:.75rem}

/* Cowork use-case examples */
.cw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.9rem;margin-top:.9rem}
.cw-ex{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:.9rem;
  border-left:4px solid var(--green)}
.cw-ex.is-heavy{border-left-color:#B8630F}
.cw-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;margin-bottom:.4rem}
.cw-ex h4{margin:0;font-size:.86rem;line-height:1.35}
.cw-band{flex:none;font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:.15rem .5rem;border-radius:999px;background:var(--green);color:#fff}
.cw-ex.is-heavy .cw-band{background:#B8630F}
.cw-ex p{margin:0;font-size:.79rem;line-height:1.5;color:var(--muted)}

/* credit estimator */
.est{margin:1.1rem 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.est-head{background:var(--ink);color:#fff;padding:.85rem 1.1rem;display:flex;
  align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.est-head h4{margin:0;font-size:.9rem;color:#fff}
.est-verdict{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:.2rem .65rem;border-radius:999px;background:rgba(255,255,255,.16)}
.est-verdict.is-light{background:#8A8A8A}
.est-verdict.is-medium{background:var(--green)}
.est-verdict.is-heavy{background:#B8630F}
.est-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0}
.est-cell{padding:.9rem 1.1rem;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.est-cell:last-child{border-right:none}
.est-cell small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.est-cell b{font-size:1.15rem;font-weight:800;color:var(--ink);display:block;line-height:1.2}
.est-cell span{font-size:.72rem;color:var(--muted)}
.est-foot{padding:.85rem 1.1rem;border-top:1px solid var(--line);background:var(--cream);
  font-size:.81rem;line-height:1.5;color:var(--ink)}
.est-foot strong{font-weight:750}
.export-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.6rem 0 .4rem}

/* resource rail lists — .dl in the base sheet is a download pill, not a list */
.resources{overflow-x:hidden}
.rlist{list-style:none;margin:.3rem 0 0;padding:0}
.rlist li{position:relative;padding:.3rem 0 .3rem .85rem;font-size:.82rem;line-height:1.45;
  color:rgba(255,255,255,.82)}
.rlist li:before{content:"";position:absolute;left:0;top:.72rem;width:5px;height:5px;
  border-radius:50%;background:var(--green)}
.rlist strong{color:#fff;font-weight:650}
.resources .open-copilot{justify-content:flex-start}
.resources .open-copilot:before{content:none}
#export-md-side{width:100%;margin-top:.5rem}

/* the base sheet sets `.note strong{display:block}` so the opening phrase acts
   as a heading — that breaks any bold used mid-sentence, so restrict it to the
   strong that directly follows the label */
.note strong{display:inline}
.note strong.lead{display:block;margin-bottom:.2rem}

/* contrast: label chips and the muted note under a prompt card */
.note .lbl{color:#04603A}
.note.blue .lbl{color:#054B87}
.note.amber .lbl{color:#8A4700}
.why{color:#4A4A4A}
.resources .ph{color:rgba(255,255,255,.72)}

/* keep the three-app chain on one line until there is genuinely no room */
.chainmap{flex-wrap:nowrap;align-items:stretch}
.chainmap .cp-step{flex:1 1 0;min-width:0}
.chainmap .handoff{flex:0 0 auto;max-width:88px}
@media (max-width:1150px){ .chainmap{flex-wrap:wrap} .chainmap .cp-step{flex:1 1 210px} }

/* a tall textarea beside a single-line input left the short field floating —
   align every control to the bottom of its row instead */
.ws-grid{align-items:end}
/* the base label is a flex column, which blockifies any inline <strong> in the
   label text onto its own line — use block flow and space the control instead */
.ws-grid label{display:block}
.ws-grid label > input,.ws-grid label > textarea,.ws-grid label > select{margin-top:.38rem}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:#0B3B26;padding:24px}
#gate:before{content:"";position:absolute;inset:0;
  background:radial-gradient(1100px 520px at 18% -10%,rgba(0,167,88,.55),transparent 62%),
             radial-gradient(760px 420px at 92% 108%,rgba(0,135,74,.45),transparent 60%)}
.gate-card{position:relative;width:100%;max-width:440px;background:#fff;border-radius:18px;
  padding:30px 32px 30px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55)}
.gate-card .band{height:4px;border-radius:4px;background:var(--green);margin:0 0 20px}
.gate-card h1{font-size:20px;margin:0 0 6px}
.gate-card .sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.gate-card label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.gate-card input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none}
.gate-card input:focus{border-color:var(--green)}
.gate-card button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;
  background:var(--green);color:#fff;font-weight:650;cursor:pointer;font-size:15px}
.gate-card button:hover{filter:brightness(1.07)}
.gate-err{color:#b3261e;font-size:13px;margin-top:10px;min-height:18px}
.gate-foot{position:relative;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:11px}
.gate-foot img{height:16px;width:auto;opacity:.8}
.gate-foot span{font-size:11.5px;color:var(--muted);line-height:1.4}
#app{display:none}
@media (max-width:900px){
  .pattern,.vs,.ws-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
const B64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pass){
  const blob = JSON.parse(atob(document.getElementById('payload').textContent.trim()));
  const salt = B64(blob.s), iv = B64(blob.i), ct = B64(blob.c);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:blob.n, hash:'SHA-256'},
                km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
const gerr = document.getElementById('gerr');
async function tryUnlock(pass, silent){
  gerr.textContent = silent ? '' : 'Checking\u2026';
  try{
    const d = await decryptPayload(pass);
    sessionStorage.setItem('mlf-asia-key', pass);
    document.getElementById('gate').remove();
    const app = document.getElementById('app');
    app.innerHTML = d.html;
    app.style.display = 'block';
    const s = document.createElement('script');
    s.textContent = d.js;
    document.body.appendChild(s);
  } catch(e){
    if(!silent){ gerr.textContent = 'That passphrase did not work. Check your session invite.'; }
    else { document.getElementById('gate').style.display = 'flex'; }
  }
}
document.getElementById('unlock').onclick = () => tryUnlock(document.getElementById('pw').value, false);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('unlock').click();
});
(function(){
  const k = sessionStorage.getItem('mlf-asia-key');
  if(k){ document.getElementById('gate').style.display = 'none'; tryUnlock(k, true); }
  else { setTimeout(() => { const el = document.getElementById('pw'); if(el) el.focus(); }, 80); }
})();
</script>
